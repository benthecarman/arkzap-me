[package]
name = "arkzap-me"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/benthecarman/arkzap-me"
homepage = "arkzap.me"
readme = "README.md"
description = "A LNURL server for Bark and Arkade"

[[bin]]
name = "arkzap-me"
path = "src/main.rs"

[dependencies]
ark-lib = "0.8.0"
bark-rest-client = "0.8.0"
ark-bdk-wallet = "0.12.0"
ark-client = "0.12.0"
ark-core = "0.12.0"

anyhow = "1.0"
async-trait = "0.1"
axum = "0.8.9"
bitcoin = { version = "0.32.7", features = ["serde"] }
clap = { version = "4.1.14", features = ["derive", "env"] }
chrono = { version = "0.4.26", features = ["serde"] }
diesel = { version = "2.1", features = ["postgres", "postgres_backend", "r2d2", "chrono", "numeric", "serde_json"] }
diesel_migrations = "2.1"
dotenvy = "0.15.7"
lnurl-rs = { version = "0.9.0", default-features = false }
lightning-invoice = { version = "0.33.2", features = ["serde", "std"] }
log = "0.4"
nostr = { version = "0.45.5", default-features = false, features = ["std", "os-rng"] }
nostr-sdk = "0.45.4"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.13", features = ["json"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.26.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout"] }
hex = "0.4.3"

[dev-dependencies]
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }
